name: Cypress Tests

on:
  push:
    branches: [ 'dev' ]

jobs:
  cypress-run:
    runs-on: ubuntu-22.04
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make envfile
        uses: SpicyPizza/create-envfile@v2.0
        with:
          directory: .
          file_name: .env.local
          envkey_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          envkey_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          envkey_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          envkey_DB_CONNECT: ${{ secrets.DB_CONNECT }}
          envkey_APP_URL: http://localhost:3000

      - name: Install app dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      # Started here rather than with the Cypress action's start/wait-on: its ping gives up on the
      # first ERR_SOCKET_CLOSED_BEFORE_CONNECTION (raised while the server is still down) instead of retrying.
      - name: Start app
        run: |
          nohup npm start > "$RUNNER_TEMP/next.log" 2>&1 &
          timeout 60 bash -c 'until curl -s -o /dev/null http://127.0.0.1:3000; do sleep 1; done' \
            || { cat "$RUNNER_TEMP/next.log"; exit 1; }

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: unit_tests/cypress

      - name: App server log
        if: always()
        run: cat "$RUNNER_TEMP/next.log" || true
